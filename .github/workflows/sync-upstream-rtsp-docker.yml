name: Sync Upstream RTSP Docker Image

on:
  schedule:
    - cron: "45 5 * * 4"
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Rebuild and push the SHA-suffixed tag even when it already exists on Docker Hub"
        required: false
        type: boolean
        default: false
      confirm_overwrite_tag:
        description: "Required with force_publish; enter the exact SHA-suffixed tag to overwrite (e.g. 2.5.5-rtsp-1c81f0f)"
        required: false
        type: string
        default: ""
      skip_build:
        description: "Only pull and merge upstream into the sync branch; do not build or push a Docker image"
        required: false
        type: boolean
        default: false
      ai_resolve_conflicts:
        description: "Resolve merge conflicts with Gemini (needs the GEMINI_API_KEY secret); AI-resolved merges are never published in the same run"
        required: false
        type: boolean
        default: true
      gemini_model:
        description: "Gemini model used for conflict resolution"
        required: false
        type: string
        default: "gemini-flash-latest"

permissions: {}

concurrency:
  group: sync-upstream-rtsp-docker
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: louislam/uptime-kuma
  UPSTREAM_GIT_URL: https://github.com/louislam/uptime-kuma.git
  BASE_IMAGE_REPOSITORY: louislam/uptime-kuma
  DOWNSTREAM_IMAGE: nbetcher/uptime-kuma
  RTSP_BRANCH: rtsp-monitor

jobs:
  prepare-rtsp-source:
    if: github.repository == 'nbetcher/uptime-kuma'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.publish_state.outputs.publish }}
      downstream_tags: ${{ steps.docker_tags.outputs.downstream_tags }}
      version_sha_tag: ${{ steps.docker_tags.outputs.version_sha_tag }}
      latest_tag: ${{ steps.docker_tags.outputs.latest_tag }}
      short_sha: ${{ steps.docker_tags.outputs.short_sha }}
      source_revision: ${{ steps.build_source.outputs.source_revision }}
      sync_branch: ${{ steps.merge.outputs.sync_branch }}
      ai_resolved: ${{ steps.merge.outputs.ai_resolved }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: rtsp-monitor
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20

      - name: Resolve latest upstream stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_json="$(mktemp)"
          gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" > "${release_json}"

          tag_name="$(jq -r '.tag_name // empty' "${release_json}")"
          draft="$(jq -r 'if .draft == false then "false" elif .draft == true then "true" else "true" end' "${release_json}")"
          prerelease="$(jq -r 'if .prerelease == false then "false" elif .prerelease == true then "true" else "true" end' "${release_json}")"
          version="${tag_name#v}"

          if [ "${draft}" = "true" ] || [ "${prerelease}" = "true" ]; then
            echo "::error::Latest upstream release ${tag_name:-unknown} is not a published stable release."
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest upstream release tag ${tag_name:-unknown} is not a plain stable semver tag."
            exit 1
          fi

          echo "upstream_tag=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Merge latest upstream release into RTSP branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.gemini_model || 'gemini-flash-latest' }}
          AI_RESOLVE_CONFLICTS: ${{ github.event_name != 'workflow_dispatch' || inputs.ai_resolve_conflicts }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream "${UPSTREAM_GIT_URL}" || git remote set-url upstream "${UPSTREAM_GIT_URL}"
          git fetch upstream "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          git fetch --force origin "refs/heads/${RTSP_BRANCH}:refs/remotes/origin/${RTSP_BRANCH}"

          safe_tag="$(printf "%s" "${UPSTREAM_TAG}" | tr -c 'A-Za-z0-9._-' '-')"
          sync_branch="sync/upstream-${safe_tag}-rtsp"

          reuse=false
          if git ls-remote --exit-code --heads origin "${sync_branch}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${sync_branch}:refs/remotes/origin/${sync_branch}"

            if git merge-base --is-ancestor "refs/tags/${UPSTREAM_TAG}" "origin/${sync_branch}" \
               && git merge-base --is-ancestor "origin/${RTSP_BRANCH}" "origin/${sync_branch}"; then
              reuse=true
            fi
          fi

          if [ "${reuse}" = "true" ]; then
            git switch -C "${sync_branch}" "origin/${sync_branch}"
          else
            git switch -C "${sync_branch}" "origin/${RTSP_BRANCH}"
            git config merge.conflictStyle diff3
            if ! git merge --no-edit "refs/tags/${UPSTREAM_TAG}"; then
              if [ "${AI_RESOLVE_CONFLICTS}" != "true" ] || [ -z "${GEMINI_API_KEY}" ]; then
                git merge --abort || true
                echo "::error::Upstream ${UPSTREAM_TAG} does not merge cleanly into ${RTSP_BRANCH}. Resolve the conflict locally on ${RTSP_BRANCH}, push the resolution, then rerun this workflow (or enable ai_resolve_conflicts with the GEMINI_API_KEY secret set)."
                exit 1
              fi

              cat > "${RUNNER_TEMP}/resolve-conflicts.js" <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const apiKey = process.env.GEMINI_API_KEY;
          const model = process.env.GEMINI_MODEL;
          const upstreamTag = process.env.UPSTREAM_TAG;
          const rtspBranch = process.env.RTSP_BRANCH;
          const contextLines = 40;
          const markerPattern = /^(<{7}|\|{7}|={7}|>{7})( |$)/m;

          const git = (...args) => execFileSync("git", args, { encoding: "utf8" });

          async function sleep(ms) {
              await new Promise((r) => setTimeout(r, ms));
          }

          async function askGemini(prompt) {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
              const body = {
                  contents: [{ role: "user", parts: [{ text: prompt }] }],
                  generationConfig: {
                      temperature: 0,
                      responseMimeType: "application/json",
                      responseSchema: {
                          type: "OBJECT",
                          properties: { resolution: { type: "STRING" } },
                          required: ["resolution"],
                      },
                  },
              };
              for (let attempt = 1; attempt <= 4; attempt++) {
                  let response;
                  try {
                      response = await fetch(url, {
                          method: "POST",
                          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
                          body: JSON.stringify(body),
                          signal: AbortSignal.timeout(180000),
                      });
                  } catch (error) {
                      if (attempt === 4) throw error;
                      await sleep((3 ** attempt) * 1000);
                      continue;
                  }
                  if (response.ok) {
                      const data = await response.json();
                      const candidate = (data.candidates || [])[0];
                      if (!candidate || candidate.finishReason !== "STOP") {
                          throw new Error(`Gemini did not finish the response (finishReason: ${candidate ? candidate.finishReason : "none"})`);
                      }
                      const text = (candidate.content.parts || []).map((part) => part.text || "").join("");
                      return JSON.parse(text).resolution;
                  }
                  if (attempt === 4 || ![429, 500, 502, 503, 504].includes(response.status)) {
                      throw new Error(`Gemini request failed: ${response.status} ${await response.text()}`);
                  }
                  await sleep((3 ** attempt) * 1000);
              }
          }

          async function resolveFile(path) {
              const lines = fs.readFileSync(path, "utf8").split("\n");
              const output = [];
              let hunkCount = 0;

              for (let i = 0; i < lines.length; i++) {
                  if (!lines[i].startsWith("<<<<<<< ")) {
                      output.push(lines[i]);
                      continue;
                  }

                  const start = i;
                  while (i < lines.length && !lines[i].startsWith(">>>>>>> ")) {
                      i++;
                  }
                  if (i >= lines.length) {
                      throw new Error(`${path}: unterminated conflict hunk at line ${start + 1}`);
                  }

                  const hunk = lines.slice(start, i + 1).join("\n");
                  const before = lines.slice(Math.max(0, start - contextLines), start).join("\n");
                  const after = lines.slice(i + 1, i + 1 + contextLines).join("\n");
                  hunkCount++;

                  const prompt = [
                      `You are resolving a git merge conflict in the file \`${path}\` of Uptime Kuma.`,
                      `OURS (the first section) is the fork branch \`${rtspBranch}\`, which adds an RTSP camera monitor type and fork-specific settings (Docker image and repository names use nbetcher/uptime-kuma instead of louislam/uptime-kuma).`,
                      `The section after the ||||||| marker is the common ancestor (BASE).`,
                      `THEIRS (after =======) is the upstream release ${upstreamTag}.`,
                      "",
                      "Merge rules:",
                      "- Keep every upstream change from THEIRS (bug fixes, refactors, new features, dependency versions).",
                      "- Keep the fork's RTSP feature additions and the fork's nbetcher/uptime-kuma naming from OURS.",
                      "- Where both sides changed the same code for different reasons, combine both changes so the result is valid code.",
                      "- For the package version field, use the upstream value.",
                      "- Do not invent new code beyond what is needed to combine the two sides.",
                      "",
                      "Return JSON {\"resolution\": \"...\"} where resolution is the exact text that replaces the whole conflict hunk (including its marker lines).",
                      "It must contain no conflict markers and no code fences, and must keep the file's existing indentation style.",
                      "",
                      "Context before the hunk (do not repeat it):",
                      before,
                      "",
                      "Conflict hunk:",
                      hunk,
                      "",
                      "Context after the hunk (do not repeat it):",
                      after,
                  ].join("\n");

                  const resolution = await askGemini(prompt);
                  if (typeof resolution !== "string" || markerPattern.test(resolution)) {
                      throw new Error(`${path}: Gemini returned an invalid resolution for hunk ${hunkCount}`);
                  }
                  if (resolution !== "") {
                      output.push(...resolution.replace(/\n$/, "").split("\n"));
                  }
              }

              const merged = output.join("\n");
              if (markerPattern.test(merged)) {
                  throw new Error(`${path}: conflict markers remain after resolution`);
              }
              fs.writeFileSync(path, merged);

              if (path.endsWith(".json")) {
                  JSON.parse(merged);
              } else if (/\.(js|cjs|mjs)$/.test(path)) {
                  execFileSync("node", ["--check", path], { stdio: "inherit" });
              }

              console.log(`Resolved ${hunkCount} hunk(s) in ${path}`);
              return hunkCount;
          }

          (async () => {
              const entries = git("status", "--porcelain=v1", "-z").split("\0").filter(Boolean);
              const conflicts = entries
                  .filter((entry) => /^(DD|AU|UD|UA|DU|AA|UU) /.test(entry))
                  .map((entry) => ({ code: entry.slice(0, 2), path: entry.slice(3) }))
                  // package.json first: node --check reads it, so it must be valid before checking scripts
                  .sort((a, b) => (b.path === "package.json") - (a.path === "package.json"));
              const summary = [`### Gemini conflict resolution (${model})`, "", "| File | Resolution |", "|---|---|"];
              let lockfileConflict = false;

              for (const { code, path } of conflicts) {
                  if (path === "package-lock.json") {
                      lockfileConflict = true;
                      continue;
                  }
                  if (["UD", "DU", "DD"].includes(code)) {
                      // One side deleted the file; it is obsolete in the merged tree
                      git("rm", "--quiet", "--", path);
                      summary.push(`| \`${path}\` | deleted (${code}) |`);
                      continue;
                  }
                  if (!["UU", "AA"].includes(code)) {
                      throw new Error(`${path}: unsupported conflict type ${code}; resolve it manually`);
                  }
                  const hunks = await resolveFile(path);
                  git("add", "--", path);
                  summary.push(`| \`${path}\` | ${hunks} hunk(s) merged by Gemini |`);
              }

              if (lockfileConflict) {
                  // Regenerate the lockfile from upstream's against the merged package.json instead of merging it as text
                  git("checkout", "--theirs", "--", "package-lock.json");
                  execFileSync("npm", ["install", "--package-lock-only", "--ignore-scripts", "--no-audit", "--no-fund"], { stdio: "inherit" });
                  git("add", "--", "package-lock.json");
                  summary.push("| `package-lock.json` | regenerated from upstream's lockfile |");
              }

              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
          })().catch((error) => {
              console.error(`::error::${error.message}`);
              process.exit(1);
          });
          NODE

              if ! node "${RUNNER_TEMP}/resolve-conflicts.js"; then
                git merge --abort || true
                echo "::error::Gemini could not resolve the conflicts merging ${UPSTREAM_TAG} into ${RTSP_BRANCH}. Resolve them locally on ${RTSP_BRANCH}, push the resolution, then rerun this workflow."
                exit 1
              fi

              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "::error::Unresolved conflicts remain: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
                exit 1
              fi

              git commit --no-edit -m "Merge upstream ${UPSTREAM_TAG} into ${RTSP_BRANCH}" -m "Merge conflicts resolved automatically with ${GEMINI_MODEL}; review before publishing."

              # Prove the AI-merged tree installs and builds before pushing it anywhere
              npm ci --ignore-scripts --no-audit --no-fund
              npm run build

              echo "ai_resolved=true" >> "${GITHUB_OUTPUT}"
              echo "::warning::Merge conflicts were resolved by ${GEMINI_MODEL}. Review ${sync_branch}, then rerun this workflow to build and publish it."
            fi
            auth_header="$(node -e 'process.stdout.write(Buffer.from(`x-access-token:${process.env.GH_TOKEN}`).toString("base64"))')"
            git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${auth_header}"
            trap 'git config --local --unset-all "http.https://github.com/.extraheader" || true' EXIT
            git push origin "HEAD:refs/heads/${sync_branch}" --force-with-lease
            git config --local --unset-all "http.https://github.com/.extraheader"
            trap - EXIT
          fi

          echo "sync_branch=${sync_branch}" >> "${GITHUB_OUTPUT}"

      - name: Mark downstream RTSP version
        env:
          RTSP_VERSION: ${{ steps.release.outputs.version }}-rtsp
        run: |
          set -euo pipefail

          npm --no-git-tag-version --ignore-scripts --allow-same-version version "${RTSP_VERSION}"

      - name: Use upstream Docker base images
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const file = "docker/dockerfile";
          const dockerfile = fs.readFileSync(file, "utf8")
              .replace(/nbetcher\/uptime-kuma:base2/g, "louislam/uptime-kuma:base2")
              .replace(/nbetcher\/uptime-kuma:builder-go/g, "louislam/uptime-kuma:builder-go");

          fs.writeFileSync(file, dockerfile);
          NODE

      - name: Commit downstream build metadata
        id: build_source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ steps.merge.outputs.sync_branch }}
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docker/dockerfile

          if git diff --cached --quiet; then
            echo "source_revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git commit -m "Prepare RTSP Docker image for ${UPSTREAM_TAG}"
          git fetch origin "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}"
          auth_header="$(node -e 'process.stdout.write(Buffer.from(`x-access-token:${process.env.GH_TOKEN}`).toString("base64"))')"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${auth_header}"
          trap 'git config --local --unset-all "http.https://github.com/.extraheader" || true' EXIT
          git push origin "HEAD:refs/heads/${SYNC_BRANCH}" --force-with-lease
          git config --local --unset-all "http.https://github.com/.extraheader"
          trap - EXIT
          echo "source_revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Determine downstream Docker tags
        id: docker_tags
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_REVISION: ${{ steps.build_source.outputs.source_revision }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const releaseVersion = process.env.RELEASE_VERSION;
          const sourceRevision = process.env.SOURCE_REVISION;
          if (!/^[0-9a-f]{40}$/.test(sourceRevision)) {
              throw new Error(`Refusing to publish: SOURCE_REVISION is not a full git SHA (${sourceRevision}).`);
          }
          const shortSha = sourceRevision.slice(0, 7);
          const dockerTagPattern = /^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$/;
          const versionShaTag = `${releaseVersion}-rtsp-${shortSha}`;
          const latestTag = "latest-rtsp";
          const downstreamTags = [versionShaTag, latestTag];

          for (const tag of downstreamTags) {
              if (!dockerTagPattern.test(tag)) {
                  throw new Error(`Refusing to publish invalid Docker tag: ${tag}`);
              }
          }

          console.log(`Publishing downstream tags: ${downstreamTags.join(", ")}`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `downstream_tags=${downstreamTags.join(",")}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_sha_tag=${versionShaTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `latest_tag=${latestTag}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `short_sha=${shortSha}\n`);
          NODE

      - name: Check downstream publish state
        id: publish_state
        env:
          DOWNSTREAM_IMAGE: ${{ env.DOWNSTREAM_IMAGE }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_publish }}
          SKIP_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_build }}
          AI_RESOLVED: ${{ steps.merge.outputs.ai_resolved == 'true' }}
          CONFIRM_OVERWRITE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_overwrite_tag || '' }}
          VERSION_SHA_TAG: ${{ steps.docker_tags.outputs.version_sha_tag }}
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");

          const forcePublish = process.env.FORCE_PUBLISH === "true";
          const skipBuild = process.env.SKIP_BUILD === "true";
          const aiResolved = process.env.AI_RESOLVED === "true";
          const confirmOverwriteTag = process.env.CONFIRM_OVERWRITE_TAG || "";
          const versionShaTag = process.env.VERSION_SHA_TAG;
          const maxAttempts = 4;
          const retryStatuses = new Set([429, 500, 502, 503, 504]);

          async function sleep(ms) {
              await new Promise((r) => setTimeout(r, ms));
          }

          async function fetchTag(tag) {
              const url = `https://hub.docker.com/v2/repositories/${process.env.DOWNSTREAM_IMAGE}/tags/${encodeURIComponent(tag)}`;
              let lastError;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                  let response;
                  try {
                      response = await fetch(url, { signal: AbortSignal.timeout(10000) });
                  } catch (error) {
                      if (attempt === maxAttempts) throw error;
                      lastError = error;
                      await sleep((3 ** attempt) * 1000);
                      continue;
                  }
                  if (response.status === 404) return null;
                  if (response.ok) return await response.json();
                  const error = new Error(`Docker Hub tag lookup failed for ${tag}: ${response.status} ${response.statusText}`);
                  if (attempt === maxAttempts || !retryStatuses.has(response.status)) throw error;
                  lastError = error;
                  await sleep((3 ** attempt) * 1000);
              }
              throw lastError;
          }

          async function main() {
              if (skipBuild) {
                  if (forcePublish) {
                      throw new Error("skip_build and force_publish cannot both be set.");
                  }
                  console.log(`::notice::skip_build requested. Upstream merged into the sync branch; ${versionShaTag} will not be built or pushed.`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=false\n");
                  return;
              }

              if (aiResolved) {
                  console.log(`::notice::Merge conflicts were resolved by AI. ${versionShaTag} is not published until the sync branch is reviewed and this workflow is rerun.`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=false\n");
                  return;
              }

              if (forcePublish) {
                  if (confirmOverwriteTag !== versionShaTag) {
                      throw new Error(`force_publish requires confirm_overwrite_tag to exactly match: ${versionShaTag}`);
                  }
                  console.log(`::notice::Manual force_publish requested. Existing ${versionShaTag} will be overwritten if it exists.`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=true\n");
                  return;
              }

              const tagInfo = await fetchTag(versionShaTag);
              if (tagInfo) {
                  console.log(`::notice::${versionShaTag} already exists on Docker Hub. Nothing to publish (use force_publish to override).`);
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=false\n");
                  return;
              }

              fs.appendFileSync(process.env.GITHUB_OUTPUT, "publish=true\n");
          }

          main().catch((error) => {
              console.error(`::error::${error.message}`);
              process.exit(1);
          });
          NODE

  build-downstream-image:
    needs: prepare-rtsp-source
    if: github.repository == 'nbetcher/uptime-kuma' && needs.prepare-rtsp-source.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: ${{ format('dockerhub-{0}', 'production') }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ needs.prepare-rtsp-source.outputs.sync_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - name: Check Docker runtime
        run: |
          set -euo pipefail

          docker version
          docker info

      - name: Install dependencies
        run: npm clean-install --no-fund

      - name: Build merged source
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify Docker base image platforms
        run: |
          set -euo pipefail

          node <<'NODE'
          const { execFileSync } = require("child_process");

          const baseImageRepository = process.env.BASE_IMAGE_REPOSITORY;
          const images = [`${baseImageRepository}:base2`, `${baseImageRepository}:builder-go`];
          const requiredPlatforms = ["linux/amd64", "linux/arm64", "linux/arm/v7"];

          async function inspectWithRetry(image) {
              let lastError;
              for (let attempt = 1; attempt <= 3; attempt++) {
                  try {
                      return execFileSync(
                          "docker",
                          ["buildx", "imagetools", "inspect", "--raw", image],
                          { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] },
                      );
                  } catch (error) {
                      lastError = error;
                      if (attempt < 3) {
                          await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
                      }
                  }
              }
              const stderr = lastError.stderr ? lastError.stderr.toString().trim() : "";
              throw new Error(`Docker inspect failed for ${image}: ${lastError.message}${stderr ? `\nStderr: ${stderr}` : ""}`);
          }

          (async () => {
              for (const image of images) {
                  const raw = await inspectWithRetry(image);
                  const manifest = JSON.parse(raw);
                  const manifests = manifest.manifests || [];
                  const platforms = new Set(manifests.map((entry) => {
                      const platform = entry.platform || {};
                      if (!platform.os || !platform.architecture) {
                          return "";
                      }
                      return `${platform.os}/${platform.architecture}${platform.variant ? `/${platform.variant}` : ""}`;
                  }).filter(Boolean));
                  const missingPlatforms = requiredPlatforms.filter((platform) => !platforms.has(platform));
                  if (missingPlatforms.length > 0) {
                      throw new Error(`${image} is missing required platforms: ${missingPlatforms.join(", ")}`);
                  }
              }
          })().catch((error) => {
              console.error(`::error::${error.message}`);
              process.exit(1);
          });
          NODE

      - name: Build and push downstream RTSP Docker image
        env:
          DOWNSTREAM_TAGS: ${{ needs.prepare-rtsp-source.outputs.downstream_tags }}
          SOURCE_REVISION: ${{ needs.prepare-rtsp-source.outputs.source_revision }}
        run: |
          set -euo pipefail

          tag_args=()
          IFS=',' read -ra tags <<< "${DOWNSTREAM_TAGS}"
          for tag in "${tags[@]}"; do
            tag_args+=("-t" "${DOWNSTREAM_IMAGE}:${tag}")
          done

          docker buildx build \
            -f docker/dockerfile \
            --platform linux/amd64,linux/arm64,linux/arm/v7 \
            "${tag_args[@]}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${SOURCE_REVISION}" \
            --provenance=true \
            --sbom=true \
            --target release \
            . \
            --push
