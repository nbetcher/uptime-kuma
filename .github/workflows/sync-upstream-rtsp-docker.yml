name: Sync Upstream RTSP

on:
  schedule:
    - cron: "45 5 * * 4"
  workflow_dispatch:
    inputs:
      ai_resolve_conflicts:
        description: "Resolve merge conflicts with Gemini before validation and release"
        required: false
        type: boolean
        default: true
      gemini_model:
        description: "Gemini model used for conflict resolution"
        required: false
        type: string
        default: "gemini-flash-latest"

permissions: {}

concurrency:
  group: sync-upstream-rtsp-docker
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: louislam/uptime-kuma
  UPSTREAM_GIT_URL: https://github.com/louislam/uptime-kuma.git
  RTSP_BRANCH: rtsp-monitor

jobs:
  prepare-rtsp-source:
    if: github.repository == 'nbetcher/uptime-kuma'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: write
      contents: write
    outputs:
      source_revision: ${{ steps.build_source.outputs.source_revision }}
      upstream_tag: ${{ steps.release.outputs.upstream_tag }}

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ env.RTSP_BRANCH }}
          persist-credentials: false
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 20

      - name: Resolve latest upstream stable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          release_json="$(mktemp)"
          gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" > "${release_json}"

          tag_name="$(jq -r '.tag_name // empty' "${release_json}")"
          draft="$(jq -r 'if .draft == false then "false" elif .draft == true then "true" else "true" end' "${release_json}")"
          prerelease="$(jq -r 'if .prerelease == false then "false" elif .prerelease == true then "true" else "true" end' "${release_json}")"
          version="${tag_name#v}"

          if [ "${draft}" = "true" ] || [ "${prerelease}" = "true" ]; then
            echo "::error::Latest upstream release ${tag_name:-unknown} is not a published stable release."
            exit 1
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest upstream release tag ${tag_name:-unknown} is not a plain stable semver tag."
            exit 1
          fi

          echo "upstream_tag=${tag_name}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Merge latest upstream release into RTSP branch
        id: merge
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ github.event_name == 'workflow_dispatch' && inputs.gemini_model || 'gemini-flash-latest' }}
          AI_RESOLVE_CONFLICTS: ${{ github.event_name != 'workflow_dispatch' || inputs.ai_resolve_conflicts }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream "${UPSTREAM_GIT_URL}" || git remote set-url upstream "${UPSTREAM_GIT_URL}"
          git fetch upstream "refs/tags/${UPSTREAM_TAG}:refs/tags/${UPSTREAM_TAG}"
          git fetch --force origin "refs/heads/${RTSP_BRANCH}:refs/remotes/origin/${RTSP_BRANCH}"

          git switch -C "${RTSP_BRANCH}" "origin/${RTSP_BRANCH}"

          if ! git merge-base --is-ancestor "refs/tags/${UPSTREAM_TAG}" HEAD; then
            git config merge.conflictStyle diff3
            git merge --no-commit --no-ff "refs/tags/${UPSTREAM_TAG}" || true

            # Keep this fork's .github/workflows: GITHUB_TOKEN cannot push workflow changes,
            # and upstream's workflows are not part of the Docker image.
            git checkout "origin/${RTSP_BRANCH}" -- .github/workflows
            git diff --cached --name-only -z --diff-filter=A "origin/${RTSP_BRANCH}" -- .github/workflows \
              | xargs -0 -r git rm -q -f --

            if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
              if [ "${AI_RESOLVE_CONFLICTS}" != "true" ] || [ -z "${GEMINI_API_KEY}" ]; then
                git merge --abort || true
                echo "::error::Upstream ${UPSTREAM_TAG} does not merge cleanly into ${RTSP_BRANCH}. Resolve the conflict locally on ${RTSP_BRANCH}, push the resolution, then rerun this workflow (or enable ai_resolve_conflicts with the GEMINI_API_KEY secret set)."
                exit 1
              fi

              cat > "${RUNNER_TEMP}/resolve-conflicts.js" <<'NODE'
          const fs = require("fs");
          const { execFileSync } = require("child_process");

          const apiKey = process.env.GEMINI_API_KEY;
          const model = process.env.GEMINI_MODEL;
          const upstreamTag = process.env.UPSTREAM_TAG;
          const rtspBranch = process.env.RTSP_BRANCH;
          const contextLines = 40;
          const markerPattern = /^(<{7}|\|{7}|={7}|>{7})( |$)/m;

          const git = (...args) => execFileSync("git", args, { encoding: "utf8" });

          async function sleep(ms) {
              await new Promise((r) => setTimeout(r, ms));
          }

          async function askGemini(prompt) {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
              const body = {
                  contents: [{ role: "user", parts: [{ text: prompt }] }],
                  generationConfig: {
                      temperature: 0,
                      responseMimeType: "application/json",
                      responseSchema: {
                          type: "OBJECT",
                          properties: { resolution: { type: "STRING" } },
                          required: ["resolution"],
                      },
                  },
              };
              for (let attempt = 1; attempt <= 4; attempt++) {
                  let response;
                  try {
                      response = await fetch(url, {
                          method: "POST",
                          headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
                          body: JSON.stringify(body),
                          signal: AbortSignal.timeout(180000),
                      });
                  } catch (error) {
                      if (attempt === 4) throw error;
                      await sleep((3 ** attempt) * 1000);
                      continue;
                  }
                  if (response.ok) {
                      const data = await response.json();
                      const candidate = (data.candidates || [])[0];
                      if (!candidate || candidate.finishReason !== "STOP") {
                          throw new Error(`Gemini did not finish the response (finishReason: ${candidate ? candidate.finishReason : "none"})`);
                      }
                      const text = (candidate.content.parts || []).map((part) => part.text || "").join("");
                      return JSON.parse(text).resolution;
                  }
                  if (attempt === 4 || ![429, 500, 502, 503, 504].includes(response.status)) {
                      throw new Error(`Gemini request failed: ${response.status} ${await response.text()}`);
                  }
                  await sleep((3 ** attempt) * 1000);
              }
          }

          async function resolveFile(path, original, feedback) {
              const lines = original.split("\n");
              const output = [];
              let hunkCount = 0;

              for (let i = 0; i < lines.length; i++) {
                  if (!lines[i].startsWith("<<<<<<< ")) {
                      output.push(lines[i]);
                      continue;
                  }

                  const start = i;
                  while (i < lines.length && !lines[i].startsWith(">>>>>>> ")) {
                      i++;
                  }
                  if (i >= lines.length) {
                      throw new Error(`${path}: unterminated conflict hunk at line ${start + 1}`);
                  }

                  const hunk = lines.slice(start, i + 1).join("\n");
                  const before = lines.slice(Math.max(0, start - contextLines), start).join("\n");
                  const after = lines.slice(i + 1, i + 1 + contextLines).join("\n");
                  hunkCount++;

                  const prompt = [
                      `You are resolving a git merge conflict in the file \`${path}\` of Uptime Kuma.`,
                      `OURS (the first section) is the fork branch \`${rtspBranch}\`, which adds an RTSP camera monitor type and fork-specific settings (Docker image and repository names use nbetcher/uptime-kuma instead of louislam/uptime-kuma).`,
                      `The section after the ||||||| marker is the common ancestor (BASE).`,
                      `THEIRS (after =======) is the upstream release ${upstreamTag}.`,
                      "",
                      "Merge rules:",
                      "- Keep every upstream change from THEIRS (bug fixes, refactors, new features, dependency versions).",
                      "- Keep the fork's RTSP feature additions and the fork's nbetcher/uptime-kuma naming from OURS.",
                      "- Where both sides changed the same code for different reasons, combine both changes so the result is valid code.",
                      "- For the package version field, use the upstream value.",
                      "- Do not invent new code beyond what is needed to combine the two sides.",
                      "",
                      "Return JSON {\"resolution\": \"...\"} where resolution is the exact text that replaces the whole conflict hunk (including its marker lines).",
                      "It must contain no conflict markers and no code fences, and must keep the file's existing indentation style.",
                      "",
                      ...(feedback
                          ? [
                                "A previous attempt to resolve this file produced invalid code:",
                                feedback,
                                "Avoid that mistake (for example, do not declare something both sides already declare).",
                                "",
                            ]
                          : []),
                      "The full file, with every conflict hunk still unresolved (for reference only):",
                      original,
                      "",
                      "Context before the hunk (do not repeat it):",
                      before,
                      "",
                      "Conflict hunk:",
                      hunk,
                      "",
                      "Context after the hunk (do not repeat it):",
                      after,
                  ].join("\n");

                  const resolution = await askGemini(prompt);
                  if (typeof resolution !== "string" || markerPattern.test(resolution)) {
                      throw new Error(`${path}: Gemini returned an invalid resolution for hunk ${hunkCount}`);
                  }
                  if (resolution !== "") {
                      output.push(...resolution.replace(/\n$/, "").split("\n"));
                  }
              }

              const merged = output.join("\n");
              if (markerPattern.test(merged)) {
                  throw new Error(`${path}: conflict markers remain after resolution`);
              }
              fs.writeFileSync(path, merged);

              if (path.endsWith(".json")) {
                  JSON.parse(merged);
              } else if (/\.(js|cjs|mjs)$/.test(path)) {
                  try {
                      execFileSync("node", ["--check", path], { encoding: "utf8", stdio: ["ignore", "pipe", "pipe"] });
                  } catch (error) {
                      throw new Error(`node --check failed:\n${error.stderr || error.message}`);
                  }
              }

              console.log(`Resolved ${hunkCount} hunk(s) in ${path}`);
              return hunkCount;
          }

          async function resolveFileWithRetry(path) {
              const original = fs.readFileSync(path, "utf8");
              let feedback = null;
              for (let attempt = 1; attempt <= 3; attempt++) {
                  try {
                      return await resolveFile(path, original, feedback);
                  } catch (error) {
                      fs.writeFileSync(path, original);
                      if (attempt === 3) {
                          throw new Error(`${path}: ${error.message}`);
                      }
                      console.log(`::warning::${path}: attempt ${attempt} failed, retrying: ${error.message}`);
                      feedback = error.message;
                  }
              }
          }

          (async () => {
              const entries = git("status", "--porcelain=v1", "-z").split("\0").filter(Boolean);
              const conflicts = entries
                  .filter((entry) => /^(DD|AU|UD|UA|DU|AA|UU) /.test(entry))
                  .map((entry) => ({ code: entry.slice(0, 2), path: entry.slice(3) }))
                  // package.json first: node --check reads it, so it must be valid before checking scripts
                  .sort((a, b) => (b.path === "package.json") - (a.path === "package.json"));
              const summary = [`### Gemini conflict resolution (${model})`, "", "| File | Resolution |", "|---|---|"];
              let lockfileConflict = false;

              for (const { code, path } of conflicts) {
                  if (path === "package-lock.json") {
                      lockfileConflict = true;
                      continue;
                  }
                  if (["UD", "DU", "DD"].includes(code)) {
                      // One side deleted the file; it is obsolete in the merged tree
                      git("rm", "--quiet", "--", path);
                      summary.push(`| \`${path}\` | deleted (${code}) |`);
                      continue;
                  }
                  if (!["UU", "AA"].includes(code)) {
                      throw new Error(`${path}: unsupported conflict type ${code}; resolve it manually`);
                  }
                  const hunks = await resolveFileWithRetry(path);
                  git("add", "--", path);
                  summary.push(`| \`${path}\` | ${hunks} hunk(s) merged by Gemini |`);
              }

              if (lockfileConflict) {
                  // Regenerate the lockfile from upstream's against the merged package.json instead of merging it as text
                  git("checkout", "--theirs", "--", "package-lock.json");
                  execFileSync("npm", ["install", "--package-lock-only", "--ignore-scripts", "--no-audit", "--no-fund"], { stdio: "inherit" });
                  git("add", "--", "package-lock.json");
                  summary.push("| `package-lock.json` | regenerated from upstream's lockfile |");
              }

              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join("\n") + "\n");
          })().catch((error) => {
              console.error(`::error::${error.message}`);
              process.exit(1);
          });
          NODE

              if ! node "${RUNNER_TEMP}/resolve-conflicts.js"; then
                git merge --abort || true
                echo "::error::Gemini could not resolve the conflicts merging ${UPSTREAM_TAG} into ${RTSP_BRANCH}. Resolve them locally on ${RTSP_BRANCH}, push the resolution, then rerun this workflow."
                exit 1
              fi

              if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
                echo "::error::Unresolved conflicts remain: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"
                exit 1
              fi

              echo "::warning::Merge conflicts were resolved by ${GEMINI_MODEL}; the merged tree must pass validation before release."
              commit_note="Merge conflicts resolved automatically with ${GEMINI_MODEL}; validated before release."
            else
              commit_note="Workflow files are kept from ${RTSP_BRANCH}."
            fi

            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git commit -m "Merge upstream ${UPSTREAM_TAG} into ${RTSP_BRANCH}" -m "${commit_note}"
            fi
          fi

      - name: Mark downstream RTSP version
        env:
          RTSP_VERSION: ${{ steps.release.outputs.version }}-rtsp
        run: |
          set -euo pipefail

          npm --no-git-tag-version --ignore-scripts --allow-same-version version "${RTSP_VERSION}"

      - name: Use upstream Docker base images
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require("fs");
          const file = "docker/dockerfile";
          const dockerfile = fs.readFileSync(file, "utf8")
              .replace(/nbetcher\/uptime-kuma:base2/g, "louislam/uptime-kuma:base2")
              .replace(/nbetcher\/uptime-kuma:builder-go/g, "louislam/uptime-kuma:builder-go");

          fs.writeFileSync(file, dockerfile);
          NODE

      - name: Commit downstream build metadata
        id: build_source
        env:
          UPSTREAM_TAG: ${{ steps.release.outputs.upstream_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json docker/dockerfile

          if ! git diff --cached --quiet; then
            git commit -m "Prepare RTSP source for ${UPSTREAM_TAG}"
          fi

          echo "source_revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      # No tokens in this step: it runs code from the final merged tree.
      - name: Validate final RTSP source
        run: |
          set -euo pipefail

          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

      - name: Push RTSP branch and dispatch release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REVISION: ${{ steps.build_source.outputs.source_revision }}
        run: |
          set -euo pipefail

          auth_header="$(node -e 'process.stdout.write(Buffer.from(`x-access-token:${process.env.GH_TOKEN}`).toString("base64"))')"
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${auth_header}"
          trap 'git config --local --unset-all "http.https://github.com/.extraheader" || true' EXIT
          git push origin "HEAD:refs/heads/${RTSP_BRANCH}"
          git config --local --unset-all "http.https://github.com/.extraheader"
          trap - EXIT
          gh workflow run release-rtsp.yml \
            --ref "${RTSP_BRANCH}" \
            -f "source_sha=${SOURCE_REVISION}"
